# Free keep-alive: pings the app every ~14 min so the Supabase free-tier project
# doesn't auto-pause (which previously took the site down) and the DB stays warm.
# No secrets/cost. GitHub may delay scheduled runs under load — that's fine here.
name: keepalive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sS -m 30 -o /dev/null -w "ping %{http_code} in %{time_total}s\n" \
            https://calorie-tracker-gold-iota.vercel.app/api/ping || true
